# Harmonix — Docker Compose (Coolify-ready)
#
# Public entry → Coolify Traefik → api:3001 (Express proxies to web:3009).
# SQLite on volume `harmonix-data`. Pocket-TTS remains host-side for now.
#
# Domain: harmonix.peeporunclub.co.uk
# Secrets: server/.env (gitignored) or Coolify UI env.

services:
  api:
    container_name: api-rxwdj1k3qu51fqf8uwtal389
    image: lyric-api:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./server/.env
        required: false
      - path: ./.env
        required: false
    environment:
      PORT: "3001"
      NODE_ENV: production
      SQLITE_PATH: /data/harmonix.db
      FRONTEND_PROXY_TARGET: http://web:3009
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://harmonix.peeporunclub.co.uk}
      FORCE_SECURE_COOKIES: ${FORCE_SECURE_COOKIES:-true}
      TTS_SKIP_SPAWN: ${TTS_SKIP_SPAWN:-true}
      # Prefer host LAN IP (set in .env); host.docker.internal often blocked by UFW.
      TTS_BASE_URL: ${TTS_BASE_URL:-http://host.docker.internal:3002}
      POCKET_TTS_HOST: ${POCKET_TTS_HOST:-host.docker.internal}
      TTS_PORT: ${TTS_PORT:-3002}
      VALIDATE_CONCURRENCY: ${VALIDATE_CONCURRENCY:-4}
    volumes:
      - harmonix-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - web
    ports:
      # Optional host publish (ngrok / direct). Traefik uses the coolify network.
      - "${HARMONIX_API_PORT:-3001}:3001"
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.harmonix-http.rule=Host(`harmonix.peeporunclub.co.uk`)
      - traefik.http.routers.harmonix-http.entrypoints=http
      - traefik.http.routers.harmonix-http.middlewares=harmonix-https-redirect
      - traefik.http.middlewares.harmonix-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.harmonix-https-redirect.redirectscheme.permanent=true
      - traefik.http.routers.harmonix-https.rule=Host(`harmonix.peeporunclub.co.uk`)
      - traefik.http.routers.harmonix-https.entrypoints=https
      - traefik.http.routers.harmonix-https.tls=true
      - traefik.http.routers.harmonix-https.tls.certresolver=letsencrypt
      - traefik.http.routers.harmonix-https.service=harmonix-api
      - traefik.http.services.harmonix-api.loadbalancer.server.port=3001
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    container_name: web-rxwdj1k3qu51fqf8uwtal389
    image: lyric-web:latest
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3009"
      HOSTNAME: 0.0.0.0
    expose:
      - "3009"
    networks:
      - default

networks:
  coolify:
    external: true

volumes:
  harmonix-data:
