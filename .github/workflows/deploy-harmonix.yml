name: Deploy Harmonix (Coolify VPS)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-harmonix-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HARMONIX_DEPLOY_HOST }}
          username: ${{ secrets.HARMONIX_DEPLOY_USER }}
          key: ${{ secrets.HARMONIX_DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd /home/ubuntu/lyric
            git fetch origin main
            git reset --hard origin/main
            # Sync updated source into Coolify WORKDIR before building
            WORKDIR="/data/coolify/services/rxwdj1k3qu51fqf8uwtal389"
            if [ -d "$WORKDIR" ]; then
              sudo cp -r /home/ubuntu/lyric/. "$WORKDIR/"
              echo "Synced /home/ubuntu/lyric to $WORKDIR"
            fi
            HARMONIX_REDEPLOY_BOOTED=1 bash /home/ubuntu/lyric/scripts/coolify-redeploy.sh
