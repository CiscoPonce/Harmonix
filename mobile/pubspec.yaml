name: harmonix_mobile
description: Harmonix Flutter Android client — learn vocabulary through song lyrics.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.2
  just_audio: ^0.9.42
  audio_session: ^0.1.25
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  app_links: ^7.2.1
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/spotify-logo.svg
